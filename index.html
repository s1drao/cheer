<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>CheerClub — Live voice cheers for runners | CPM AI, Inc.</title>
    <meta
      name="description"
      content="CheerClub delivers voice messages from friends and family into a runner's headphones at mile markers, live during their run. An iOS app and web recorder built by CPM AI, Inc. in San Francisco."
    />
    <meta name="theme-color" content="#000000" />

    <!-- Link preview card (iMessage, WhatsApp, etc.) — kept product-flavored
         because runners' share links resolve to this origin. -->
    <meta property="og:site_name" content="CheerClub" />
    <meta property="og:title" content="Cheer for my run" />
    <meta property="og:description" content="Send a voice note — it plays in my ears while I run" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cheerclub.app/" />
    <meta property="og:image" content="https://cheerclub.app/og/track.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://cheerclub.app/og/track.png" />
    <link rel="canonical" href="https://cheerclub.app/" />

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%23a12120%22/><text x=%2250%22 y=%2272%22 font-size=%2260%22 text-anchor=%22middle%22 fill=%22%23fff%22 font-family=%22Georgia,serif%22 font-weight=%22bold%22>C</text></svg>" />


    <script>
      // Cheer share links (?t=TOKEN or /r/TOKEN) skip the landing film and
      // go straight to the recorder. Runs before first paint — no flash.
      if (/[?&]t=/.test(location.search) || /\/r\/[a-z0-9]+\/?$/i.test(location.pathname)) {
        document.documentElement.classList.add("cheer-mode");
      }
    </script>
    <style>
      .cheer-mode #site { display: none !important; }
      /* flex (not block) so the recorder's column layout can pin the
         fan artwork + carousel to the bottom edge */
      .cheer-mode #app { display: flex !important; }
    </style>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "CheerClub",
      "legalName": "CPM AI, Inc.",
      "url": "https://cheerclub.app",
      "email": "support@cheerclub.app",
      "description": "CheerClub delivers voice messages from friends and family into a runner's headphones at mile markers, live during their run.",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "2261 Market Street, STE 72868",
        "addressLocality": "San Francisco",
        "addressRegion": "CA",
        "postalCode": "94114",
        "addressCountry": "US"
      }
    }
    </script>
    <script type="module" crossorigin src="/assets/index-DAB6v3HK.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DC-aSHi-.css">
  </head>
  <body>
    <div id="site" class="film">
      <video
        class="film-video"
        id="hero-video"
        autoplay
        muted
        loop
        playsinline
        webkit-playsinline
        disablepictureinpicture
        preload="auto"
        poster="/hero-poster.jpg?v=2"
        aria-hidden="true"
      >
        <source src="/hero.mp4?v=2" type="video/mp4" />
      </video>
      <div class="film-veil" aria-hidden="true"></div>

      <header class="film-brand">
        <h1>CheerClub</h1>
        <p>voice notes to fuel your run</p>
      </header>

      <a
        class="film-qr"
        href="https://testflight.apple.com/join/EtqrEH2D"
        target="_blank"
        rel="noopener noreferrer"
      >
        <img src="/testflight-qr.svg" alt="Get CheerClub on TestFlight" width="240" height="240" />
      </a>

      <footer class="film-legal">
        <a href="/privacy.html">Privacy</a>
        <a href="/terms.html">Terms</a>
        <a href="/data-deletion.html">Data</a>
      </footer>
    </div>

    <!-- Cheer recorder mount (share-token flow) -->
    <main id="app" hidden>
      <div class="card">
        <p class="loading-note">warming up<span class="dots"><span>.</span><span>.</span><span>.</span></span></p>
      </div>
    </main>

  </body>
</html>
