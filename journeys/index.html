<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CheerClub · User Journeys</title>
<style>
@font-face { font-family: "Audiowide"; src: url("fonts/Audiowide-Regular.ttf"); }
@font-face { font-family: "Elms Sans"; src: url("fonts/ElmsSans-Regular.ttf"); font-weight: 400; }
@font-face { font-family: "Elms Sans"; src: url("fonts/ElmsSans-Medium.ttf"); font-weight: 500; }
@font-face { font-family: "Elms Sans"; src: url("fonts/ElmsSans-Bold.ttf"); font-weight: 700; }
:root {
  --blue: #0000F5; --yellow: #FBE74D; --green: #3A8A27; --coral: #EC605A; --sky: #469CF8; --black: #000;
  --bg: #000; --panel: #0c0c14; --panel2: #13131f; --line: #23233a; --muted: #8d8daa; --text: #f3f3f8;
  --r: 18px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: "Elms Sans", "Helvetica Neue", Helvetica, sans-serif; font-size: 15px; }
body { background:
  radial-gradient(1200px 500px at 85% -10%, rgba(0,0,245,.35), transparent 60%),
  radial-gradient(900px 400px at -10% 10%, rgba(70,156,248,.12), transparent 60%), #000; min-height: 100vh; }
a { color: var(--sky); }
h1, h2, h3, .display { font-family: "Audiowide", sans-serif; font-weight: 400; letter-spacing: .01em; }
button, select, input { font: inherit; color: inherit; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 0 28px 80px; }

/* header */
header { position: sticky; top: 0; z-index: 30; backdrop-filter: blur(16px); background: rgba(0,0,0,.72); border-bottom: 1px solid var(--line); }
.hbar { max-width: 1280px; margin: 0 auto; padding: 14px 28px; display: flex; align-items: center; gap: 22px; }
.logo { font-family: "Audiowide"; color: var(--yellow); font-size: 20px; white-space: nowrap; display: flex; align-items: center; gap: 10px; }
.logo .dot { width: 26px; height: 26px; border-radius: 50%; background: var(--blue); box-shadow: inset -5px -4px 0 rgba(0,0,0,.25), 0 0 0 3px rgba(251,231,77,.9); }
.logo small { color: var(--muted); font-family: "Elms Sans"; font-size: 13px; }
nav.tabs { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
nav.tabs button { background: none; border: 0; padding: 8px 16px; border-radius: 999px; cursor: pointer; color: var(--muted); font-weight: 500; }
nav.tabs button.on { background: var(--green); color: #fff; }
nav.tabs button:hover:not(.on) { color: var(--text); }
.spacer { flex: 1; }
.picker { display: flex; align-items: center; gap: 8px; }
select.pill, input.pill { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; outline: none; }
select.pill:focus, input.pill:focus { border-color: var(--sky); }
.fresh { color: var(--muted); font-size: 12px; max-width: 1280px; margin: 0 auto; padding: 6px 28px 0; }

/* generic */
.card { background: linear-gradient(180deg, var(--panel2), var(--panel)); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: 1fr 1fr; } .g3 { grid-template-columns: repeat(3, 1fr); } .g6 { grid-template-columns: repeat(6, 1fr); }
@media (max-width: 1000px) { .g2, .g3 { grid-template-columns: 1fr; } .g6 { grid-template-columns: repeat(2, 1fr); } }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
.chip b { color: var(--text); font-weight: 500; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.b-high { background: var(--coral); color: #000; } .b-medium { background: var(--yellow); color: #000; } .b-low { background: var(--sky); color: #000; }
.b-inf { background: transparent; border: 1px dashed var(--muted); color: var(--muted); }
.b-logs { background: rgba(70,156,248,.15); color: var(--sky); }
section { margin-top: 28px; }
section > h2 { font-size: 18px; color: var(--yellow); margin: 0 0 14px; display: flex; align-items: center; gap: 10px; }
section > h2 .count { font-family: "Elms Sans"; color: var(--muted); font-size: 13px; }
.view { display: none; } .view.on { display: block; }

/* brief */
.hero { margin-top: 26px; padding: 34px; position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -80px; top: -80px; width: 320px; height: 320px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, var(--sky), var(--blue) 60%); opacity: .55; }
.hero .who { font-family: "Audiowide"; font-size: 44px; color: var(--yellow); margin: 0; position: relative; z-index: 1; }
.hero .headline { font-size: 20px; line-height: 1.45; max-width: 860px; margin: 12px 0 18px; position: relative; z-index: 1; }
.hero .chips { display: flex; flex-wrap: wrap; gap: 8px; position: relative; z-index: 1; }
.stat { padding: 18px; }
.stat .v { font-family: "Audiowide"; font-size: 28px; color: var(--yellow); }
.stat .l { font-weight: 500; margin-top: 4px; }
.stat .s { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
ul.tldr { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
ul.tldr li { padding: 14px 16px 14px 44px; position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; line-height: 1.5; }
ul.tldr li::before { content: "📣"; position: absolute; left: 14px; top: 13px; }
.chapters { display: grid; gap: 0; position: relative; }
.chap { display: grid; grid-template-columns: 210px 1fr; gap: 22px; padding: 18px 0; border-top: 1px solid var(--line); cursor: pointer; }
.chap:hover .ct { color: var(--yellow); }
.chap .when { color: var(--muted); font-size: 13px; padding-top: 3px; }
.chap .when .tone { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; }
.chap .ct { font-weight: 700; font-size: 16.5px; margin-bottom: 6px; transition: color .15s; }
.chap .cb { line-height: 1.6; color: #d4d4e2; }
.conf { border-left: 4px solid var(--coral); }
.conf.medium { border-left-color: var(--yellow); } .conf.low { border-left-color: var(--sky); }
.conf h3 { font-family: "Elms Sans"; font-weight: 700; font-size: 16px; margin: 8px 0 10px; }
.conf dl { margin: 0; display: grid; grid-template-columns: 78px 1fr; gap: 6px 12px; font-size: 13.5px; line-height: 1.5; }
.conf dt { color: var(--muted); } .conf dd { margin: 0; }
.conf dd.fix { color: #c9f0bd; }
ul.plain { margin: 0; padding-left: 20px; line-height: 1.65; } ul.plain li { margin-bottom: 6px; }

/* heatmap */
.heat { display: grid; grid-template-columns: 120px repeat(24, 1fr); gap: 3px; font-size: 11px; }
.heat .cell { aspect-ratio: 1; border-radius: 4px; background: var(--panel2); position: relative; }
.heat .lbl { color: var(--muted); display: flex; align-items: center; white-space: nowrap; }

/* timeline */
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 22px 0 6px; }
.tog { cursor: pointer; user-select: none; display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); font-size: 13px; color: var(--muted); }
.tog .sw { width: 9px; height: 9px; border-radius: 50%; }
.tog.on { color: var(--text); border-color: #3a3a5a; background: var(--panel2); }
.tog:not(.on) .sw { opacity: .25; }
.day { margin-top: 26px; }
.dayh { position: sticky; top: 64px; z-index: 5; background: rgba(0,0,0,.85); backdrop-filter: blur(8px); padding: 10px 0; display: flex; align-items: baseline; gap: 12px; border-bottom: 1px solid var(--line); }
.dayh h3 { margin: 0; color: var(--yellow); font-size: 17px; }
.ev { display: grid; grid-template-columns: 92px 22px 1fr auto; gap: 10px; padding: 9px 10px; border-radius: 10px; align-items: start; cursor: pointer; }
.ev:hover { background: var(--panel2); }
.ev .tm { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; padding-top: 1px; }
.ev .dt { width: 12px; height: 12px; border-radius: 50%; margin-top: 4px; box-shadow: 0 0 0 3px rgba(255,255,255,.04); }
.ev .lb { line-height: 1.4; }
.ev .lb .who { color: var(--muted); font-size: 12px; margin-right: 6px; }
.ev .dd { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.ev.noise { opacity: .55; } .ev.noise .lb { font-size: 13px; }
.ev.hl { background: rgba(251,231,77,.08); outline: 1px solid rgba(251,231,77,.35); }
.gap { color: #55557a; font-size: 12px; padding: 6px 0 6px 112px; letter-spacing: .05em; }
.ev .bd { display: flex; gap: 4px; }

/* drawer */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 440px; max-width: 92vw; background: #08080f; border-left: 1px solid var(--line); z-index: 50; transform: translateX(100%); transition: transform .22s ease; padding: 26px; overflow: auto; }
.drawer.on { transform: none; }
.drawer .x { position: absolute; right: 16px; top: 14px; background: none; border: 0; font-size: 22px; color: var(--muted); cursor: pointer; }
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 8px 12px; font-size: 13.5px; margin-top: 16px; }
.kv div:nth-child(odd) { color: var(--muted); }
.quote { margin-top: 16px; padding: 14px 16px; border-radius: 12px; background: var(--panel2); border-left: 3px solid var(--yellow); line-height: 1.55; font-style: italic; }

/* race */
.racehead { display: flex; align-items: end; gap: 16px; flex-wrap: wrap; margin-top: 26px; }
.racehead h2 { margin: 0; color: var(--yellow); font-size: 26px; }
svg text { font-family: "Elms Sans", sans-serif; }
.tip { position: fixed; pointer-events: none; z-index: 60; background: #fff; color: #000; padding: 8px 10px; border-radius: 10px; font-size: 12.5px; max-width: 280px; box-shadow: 0 10px 30px rgba(0,0,0,.5); display: none; line-height: 1.4; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; color: var(--muted); font-weight: 500; padding: 8px 10px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); }
td { padding: 9px 10px; border-bottom: 1px solid #191928; vertical-align: top; }
tr:hover td { background: rgba(255,255,255,.02); }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.pill-y { background: var(--yellow); color: #000; border-radius: 999px; padding: 1px 8px; font-weight: 700; font-size: 12px; }
.pill-c { background: var(--coral); color: #000; border-radius: 999px; padding: 1px 8px; font-weight: 700; font-size: 12px; }

/* explore */
.explore { display: grid; grid-template-columns: 290px 1fr; gap: 18px; margin-top: 24px; align-items: start; }
@media (max-width: 1000px) { .explore { grid-template-columns: 1fr; } }
.side { position: sticky; top: 80px; max-height: calc(100vh - 100px); overflow: auto; }
.side h4 { margin: 16px 0 8px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
.side h4:first-child { margin-top: 0; }
.cbl { display: grid; gap: 2px; max-height: 220px; overflow: auto; }
.cbl label { display: flex; align-items: center; gap: 8px; font-size: 13.5px; padding: 4px 6px; border-radius: 8px; cursor: pointer; }
.cbl label:hover { background: var(--panel2); }
.cbl label .n { margin-left: auto; color: var(--muted); font-size: 12px; }
input[type=checkbox] { accent-color: var(--green); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn { background: var(--green); border: 0; color: #fff; padding: 8px 14px; border-radius: 999px; cursor: pointer; font-weight: 500; }
.btn.ghost { background: var(--panel2); border: 1px solid var(--line); color: var(--text); }
.bars { display: grid; gap: 6px; }
.bar { display: grid; grid-template-columns: 220px 1fr 60px; gap: 10px; align-items: center; font-size: 13px; cursor: pointer; }
.bar .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .track { height: 18px; background: var(--panel2); border-radius: 6px; overflow: hidden; display: flex; }
.bar .track span { height: 100%; }
.bar .c { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); margin-top: 10px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

/* people */
.pcard { cursor: pointer; transition: transform .12s, border-color .12s; }
.pcard:hover { transform: translateY(-2px); border-color: #3a3a5a; }
.pcard .nm { font-weight: 700; font-size: 17px; display: flex; align-items: center; gap: 8px; }
.pcard .avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-family: "Audiowide"; color: #000; font-size: 14px; flex: none; }
.spark { margin-top: 12px; height: 34px; }
.funnel { display: grid; gap: 10px; }
.fstep { display: grid; grid-template-columns: 200px 1fr 70px; gap: 12px; align-items: center; }
.fstep .track { height: 26px; background: var(--panel2); border-radius: 8px; overflow: hidden; }
.fstep .track span { display: block; height: 100%; background: linear-gradient(90deg, var(--blue), var(--sky)); border-radius: 8px; }
.empty { color: var(--muted); padding: 30px; text-align: center; }

/* phones */
@media (max-width: 700px) {
  html, body { font-size: 14px; }
  .wrap { padding: 0 14px 60px; }
  .hbar { flex-wrap: wrap; gap: 10px; padding: 10px 14px; }
  .logo { font-size: 17px; }
  .spacer { display: none; }
  .picker { margin-left: auto; }
  select.pill { max-width: 46vw; padding: 7px 12px; }
  nav.tabs { order: 3; width: 100%; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs button { padding: 8px 12px; white-space: nowrap; flex: none; }
  .fresh { padding: 6px 14px 0; }
  .card { padding: 16px; border-radius: 14px; }
  .hero { padding: 22px 18px; margin-top: 16px; }
  .hero::after { width: 180px; height: 180px; right: -60px; top: -60px; }
  .hero .who { font-size: 32px; }
  .hero .headline { font-size: 16.5px; }
  .stat { padding: 14px; } .stat .v { font-size: 22px; }
  section > h2 { font-size: 16px; flex-wrap: wrap; gap: 4px 10px; }
  ul.tldr li { padding: 12px 12px 12px 40px; }
  .chap { grid-template-columns: 1fr; gap: 4px; padding: 14px 0; }
  .conf dl { grid-template-columns: 1fr; gap: 2px; } .conf dd { margin-bottom: 8px; }
  .heat { grid-template-columns: 54px repeat(24, 1fr); gap: 2px; font-size: 9.5px; }
  .heat .cell { border-radius: 2px; }
  .dayh { top: 100px; }
  .ev { grid-template-columns: 64px 14px 1fr; gap: 8px; padding: 8px 4px; }
  .ev .bd { grid-column: 3; }
  .ev .tm { font-size: 12px; }
  .gap { padding-left: 76px; }
  .drawer { width: 100%; max-width: 100vw; padding: 22px 18px; }
  .kv { grid-template-columns: 90px 1fr; }
  .racehead h2 { font-size: 20px; }
  .side { position: static; max-height: none; }
  .bar { grid-template-columns: 100px 1fr 40px; }
  .fstep { grid-template-columns: 110px 1fr 46px; gap: 8px; }
  table { display: block; overflow-x: auto; white-space: normal; }
  td, th { min-width: 70px; }
}
</style>
</head>

    <nav class="tabs" id="tabs">
      <button data-v="brief" class="on">Brief</button>
      <button data-v="journey">Journey</button>
      <button data-v="race">Race replay</button>
      <button data-v="explore">Explore</button>

    <div class="spacer"></div>
    <div class="picker">

</header>
<div class="fresh" id="fresh"></div>

<main class="wrap">

  <div class="view" id="v-race"></div>
  <div class="view" id="v-explore"></div>
  <div class="view" id="v-people"></div>
</main>

ng, okay? Love you, bye."}, {"id": "90306836-c76b-442f-916e-9f00ac5ed894", "sender": "Lannie", "cheerer": "c:92de495e-6c0c-447e-9f6d-5a18576e8840", "t": 1794105417553, "dur": 8.0, "played": true, "transcript": "Your feet hurt right now because you're kicking so much ass. Go Ayaka, go! You got this!"}, {"id": "8a589431-0b52-4e4a-a0fe-9a7020963a8e", "sender": "Jennie", "cheerer": "u:605bb2f4-6191-4d56-ad71-4b6496414b51", "t": 1794109782162, "dur": 12.0, "played": true, "transcript": "Hi Ayaka, how's Monterey looking? I bet it's so pretty out there right now and I bet you're doing great! Keep it up, I believe in you, you got this! Go go go!"}], "analysis": null}, "67640c17-48d0-4047-83e7-1a28d78cf64f": {"id": "67640c17-48d0-4047-83e7-1a28d78cf64f", "title": "Zone 2 Run", "owner": "u:8ccabe1c-20a5-468b-a11c-09a02c650159", "status": "finished", "distance": 8.0, "miles": 11.06, "created": 1787508707458, "scheduled": 1787516100000, "theme": "raceday", "notes": [{"id": "33c47d53-a4d0-431f-b044-a0cf2672c7f1", "sender": "Sid", "cheerer": "c:e373e84d-c3ab-48cd-be0c-dbced8984297", "t": 1787508850976, "dur": 12.0, "played": true, "transcript": "Maybe you're doing lateral movements right now."}, {"id": "81fd7c87-5d0b-4425-8cc4-9867d2fa7d2b", "sender": "Sid", "cheerer": "c:e373e84d-c3ab-48cd-be0c-dbced8984297", "t": 1787514000355, "dur": 32.0, "played": true, "transcript": "Imagine you're in the Olympics now and the whole country of Japan is cheering you on and they really want you to go faster, faster. Your mom and dad in the crowd. Sheena is watching from her control center. She's like, go mama, go. Go you go faster, faster. Beat all of the country mama."}, {"id": "f14c3d7c-c727-4140-9a67-31ee059e309d", "sender": "Sid", "cheerer": "c:e373e84d-c3ab-48cd-be0c-dbced8984297", "t": 1787514027640, "dur": 21.0, "played": true, "transcript": "Look how far you have come. You couldn't even walk when you were a toddler. Imagine telling a toddler Ayaka that you will be running eight miles. She'd be like, that's stupid."}, {"id": "640a0356-42b8-4206-a341-59b1ad9badd1", "sender": "Sid", "cheerer": "c:e373e84d-c3ab-48cd-be0c-dbced8984297", "t": 1787514065292, "dur": 25.0, "played": true, "transcript": "On our way back, what if we get something good, delicious to eat? Not too unhealthy, not too healthy, something in the middle. Think about it, okay? I need some suggestions when we're done with this. Run, run, run, run, run."}, {"id": "0a9c01a6-758e-4bc6-ad38-927ff3241602", "sender": "Dhruvi", "cheerer": "c:c08ff728-f3e4-48e2-84d6-cad67059ad9a", "t": 1787516943999, "dur": 11.0, "played": true, "transcript": "Woohoo, Ayaka! Great going!"}, {"id": "653df2cc-746e-4aa1-9536-7e48938f3fd9", "sender": "Sid", "cheerer": "c:e373e84d-c3ab-48cd-be0c-dbced8984297", "t": 1787519512984, "dur": 10.0, "played": true, "transcript": "One last one. Maybe you'll receive it. This one as well. Go, go, go, go, go. You got it."}], "analysis": null}}, "briefs": {"_overview": {"headline": "One complete, successful loop (Jennie) and two testers who stalled before race day.", "tldr": ["Jennie is the first outside tester to go all the way: cheerer → signed up → shared → 19 cheers → raced with 18 of them in her ears → came back the next day, unlocked the Replay Pack, relived 10 cheers and turned Athena's into a TikTok (after ~4 export attempts — we have no TikTok path).", "Both new testers (Jennie, Haofei) are on TestFlight build 202608271228 from Aug 27 — the external TestFlight group appears to still serve that build, so they miss ~80 days of fixes, including the run-data upload (we have no route or pace data for Jennie's race).", "Haofei signed up, created two runs in 4 minutes, started his 5K and abandoned it at 0.01 mi (still stuck in “running”), and never received a cheer — most likely never shared.", "Web cheering converts well once people record: 5 of 5 cheers submitted in the logged window went through; 4 of 5 then left a phone number. But ~6 link opens in the same window left without cheering."]}, "u:605bb2f4-6191-4d56-ad71-4b6496414b51": {"headline": "Jennie ran her half marathon with 18 friends' voices in her ears, then came back the next day to relive them and turned Athena's cheer into a TikTok. The core loop worked end-to-end. The friction was at the edges: finishing the run, a late cheer with nowhere to go, getting a cheer out to TikTok, and an old build.", "tldr": ["Came in as a cheerer: recorded a 12-second cheer for Ayaka's half on Sat Nov 7 and opted into texts. Four days later she was a runner.", "Sign-up to run created in 46 seconds. No hesitation anywhere in onboarding.", "Collected 19 cheers from 16 people over 3½ days and checked the app constantly — about 30 separate app-active moments before race day, several within minutes of a cheer push.", "Race day: started 7:38 AM, all 18 waiting cheers unlocked between 7:43 and 9:44 AM — including one that arrived mid-race. Zero failed requests.", "Probably finished the race around 10:00 AM but didn't slide to finish until 11:01 AM, so the run recorded 14.33 mi for a 13.1 mi race.", "Her mom's second cheer arrived from Korea at 3:59 PM, after the race. The push told her it would “unlock at mile 12.4”; she tapped it within 9 seconds — and it still hasn't been downloaded as of Monday night.", "Monday 12:34 PM she relaunched the app, went through the Replay Pack paywall within 6 seconds, and listened through 10 cheers back-to-back on the recap card (the gaps match each cheer's length).", "Then she pulled Athena's 25-second cheer 4 more times over 17 minutes, with nothing else in between. The app was relaunched once in the middle, forcing a second paywall unlock. That's the TikTok: it took several Download/Share attempts to get one cheer out of the app.", "The app has no TikTok path. Download saves an .m4a to Files, Share sends the .m4a, and Create only targets Instagram plus Save video. To post on TikTok she had to work around us.", "“Buying” isn't measurable yet: her build unlocks the Replay Pack for free (pre-launch tester bypass), shows a $29.99/year fallback price, and re-locks every time she leaves the run screen."], "stats": [{"label": "Sign-up → run created", "value": "46s", "sub": "code autofilled in 4s"}, {"label": "Cheers received", "value": "19", "sub": "from 16 people · avg 20s each"}, {"label": "Played during the race", "value": "18 / 19", "sub": "1 arrived after she finished"}, {"label": "Race tracked", "value": "3h 23m", "sub": "7:38 → 11:01 AM"}, {"label": "Distance recorded", "value": "14.33 mi", "sub": "goal was 13.1 mi (+1.23)"}, {"label": "Push → app open", "value": "9–40s", "sub": "on 3 race-day pushes"}, {"label": "Cheers replayed after", "value": "10", "sub": "Mon 12:34–12:39 PM"}, {"label": "Athena's cheer pulled", "value": "5×", "sub": "→ the TikTok audio"}], "chapters": [{"title": "Discovery — she was a cheerer first", "when": "Sat Nov 7, 7:49 PM", "tone": "good", "body": "Jennie opened Ayaka's cheer link on cheerclub.app and recorded a 12-second note (“Hi Ayaka, how's Monterey looking? … you got this! Go go go!”). She left her phone number for updates, and the welcome text went out. This is the acquisition loop working: the cheer page turned a cheerer into a runner within four days."}, {"title": "Sign-up and first run — 46 seconds", "when": "Wed Nov 11, 8:47–8:48 PM", "tone": "good", "body": "8:47:22 requested the SMS code → 8:47:26 signed in (4 seconds, so iOS autofill) → 8:47:32 profile created as “Jennie” → 8:48:08 “Jennie's half marathon” created for Sun 7:30 AM with the Midnight theme, and its invite card generated. The onboarding video and guide didn't slow her down; she knew what she came to do."}, {"title": "Sharing and turning on notifications", "when": "Wed Nov 11, 8:48–11:46 PM", "tone": "neutral", "body": "The app stayed in use for about three hours that evening (session refreshes at 9:45, 10:47 and 11:46 PM). Push permission was granted at 11:39 PM. In her build the in-app push prompt only appears after a run is shared, so she had sent her link out by then. The first cheer (Athena) landed the next morning at 8:21 AM."}, {"title": "Collecting cheers — checking in all day", "when": "Thu Nov 12 → Sat Nov 14", "tone": "good", "body": "16 cheers arrived over three days, from Thursday morning to Saturday evening. The app was active ~25 more times, often minutes after a cheer push (e.g. Ian & Laelle 3:13 PM → app active 3:18 PM; Sharon & B 4:11 PM → 4:18 PM). Silvia sent three cheers within two minutes on Friday morning (35s, 43s, 6s). Her invite card was regenerated Friday 10:45 AM, which usually means she edited the run or reopened the share sheet."}, {"title": "The night before", "when": "Sun Nov 15, 1:30–1:39 AM", "tone": "warn", "body": "An 8-minute session in the middle of the night: she went back and forth between Home and her run page five times (2¼ min, 2 min, 18s, 10s, 1s), then opened Notifications. No cheer audio was downloaded. Cheers are locked until the run, so she could see who cheered but not listen. The repeated back-and-forth suggests she was looking for something on that page."}, {"title": "Race morning — pushes pulled her in", "when": "Sun 5:29–7:38 AM", "tone": "good", "body": "Phoebe's cheer arrived 5:29:35 → app opened 5:30:15. Another check at 5:53. Ayaka's cheer arrived 7:25:25 → app opened 7:25:37 (12s). She then spent ~12 minutes on the run page and started the run at 7:38:13, 8 minutes after her scheduled 7:30. The cheers played in a custom order, not the order they arrived in (Jon first, then Shaan, then her mom; Silvia's three last). So at some point she dragged cheers to specific miles with the Arrange feature."}, {"title": "The race — every cheer delivered", "when": "Sun 7:38–9:44 AM", "tone": "good", "body": "All 17 waiting cheers were downloaded within a second of starting. They unlocked roughly every 5–11 minutes: Jon at 7:43, Shaan 7:48, 성은 (Mom) 7:59, Ayaka 8:08 … Silvia's last one at 9:44. Joe, Shirley & Jude recorded a cheer at 7:54 while she was already running; it played at 8:29. The live connection dropped and recovered about 10 times (cell handoffs). Background checks kept everything flowing, and all 1,762 requests that session succeeded."}, {"title": "The extra hour", "when": "Sun ~10:00–11:01 AM", "tone": "warn", "body": "Until ~10:04 AM the phone reported new distance every ~16 seconds (it only reports after 5 m of movement). After that the reports thin out to one every 1–8 minutes: she was mostly standing or walking. The likeliest read is that she crossed the finish around 10:00–10:05 AM (≈2h25m) and the tracker kept going until she slid to finish at 11:01 AM. Final recorded distance: 14.33 mi on a 13.1 mi course. Her build has no auto-finish and no reminder once the goal distance is passed."}, {"title": "After the race", "when": "Sun 2:44–4:21 PM", "tone": "warn", "body": "2:44 PM: opened the app → Notifications → a 1-second glance at the run. 3:26 PM: 21s on the run page. 3:59:38 PM: Mom (now named 엄마) sent a second cheer from Korea; the push said it would “unlock automatically when you hit mile 12.4” of a race she had already finished. Jennie opened the app 9 seconds later, glanced at the run for 1s and went back Home. 4:20 PM: back on the run page twice (27s, 26s), then Notifications. At 4:20:56 the recap's Replays list loaded six cheers' audio in 4 seconds (Jon, Shaan, 성은, Ayaka, Heather, Sid). That's the list drawing real waveforms for the rows on screen, which happens even while the Replay Pack is locked, so it doesn't show whether she unlocked it on Sunday. Mom's post-race cheer was never downloaded."}, {"title": "Monday: reliving the race", "when": "Mon Nov 16, 12:34–12:39 PM", "tone": "good", "body": "Fresh launch at 12:34:18, straight to the run's recap, and the first cheer audio was fetched 6 seconds later. A relaunch wipes the in-memory tester pass, so in those 6 seconds she hit the Replay Pack paywall and tapped “Get the Replay Pack”. Jon's cheer auto-opens on the recap card, so the likely path is Play → shake → paywall → unlock → Play. She then tapped through the cheer circles on the recap card and listened to 10 cheers in a row: Jon (16s) → Shaan (3s) → Heather (29s, skipped after 11s) → Joe, Shirley & Jude (22s) → Euna (19s) → Athena (25s) → Ian & Laelle (9s) → Phoebe (28s) → “You will know by the audio” (5s) → Silvia (6s). Each next fetch came 10–34 seconds after the previous one, which matches each cheer's length. She was listening, not exporting."}, {"title": "Making the TikTok — Athena's cheer, five times", "when": "Mon Nov 16, 12:36–12:54 PM", "tone": "warn", "body": "Athena's 25-second cheer (the very first cheer she got, Thursday 8:21 AM) was fetched at 12:36:07 as part of the listen-through, then again at 12:41:21 and 12:42:26, with no other cheers and no screen changes in between. At 12:47:45 she came back to the app from somewhere else and pulled it a fourth time 7 seconds later. At 12:53:13 the app relaunched from scratch (iOS likely evicted it while she was in TikTok's editor), which re-locked the Replay Pack. She went back through the paywall and pulled Athena's cheer a fifth time 37 seconds after launch. Then nothing until 3:59 PM. Download, Share and Create each re-download the file on every tap, so 4 extra pulls means about 4 export attempts. Our read: this is the TikTok she made, and it took several tries because nothing in the app hands a cheer to TikTok."}, {"title": "Monday evening — checking in", "when": "Mon Nov 16, 3:59 PM & 9:39 PM", "tone": "neutral", "body": "3:59 PM: a quick open that never left Home. 9:39 PM: opened the run page twice but fetched no audio. In her build the Replay Pack pass resets when she leaves the run screen, so on this visit the cheers were locked again. Either she just looked, or she saw the paywall and backed out. Mom's post-race cheer (엄마, 21s) still has zero downloads."}], "postrun": {"title": "Post-run, social & buying", "intro": "Everything after “Slide to finish”: the recap, the Replay Pack paywall, listening again, exporting, and posting. The phone never tells the server about paywall taps, Download/Share/Create, Instagram or TikTok. What we can see is every cheer audio download, timed to the second. The pattern of which cheer, how often, and how far apart is what tells these actions apart.", "stats": [{"label": "Post-run app visits", "value": "9", "sub": "Sun 2:44 PM → Mon 9:39 PM (logged windows)"}, {"label": "Recap waveform load", "value": "6", "sub": "Sun 4:20 PM, visual only"}, {"label": "Cheers listened to again", "value": "10", "sub": "of 19 · Mon 12:34 PM"}, {"label": "Export attempts", "value": "~4", "sub": "all Athena's cheer"}, {"label": "Time spent on the TikTok", "value": "~18 min", "sub": "12:36 → 12:54 PM"}, {"label": "Paywall unlocks", "value": "≥2", "sub": "Mon 12:34 & 12:53 · $0, tester bypass"}], "steps": [{"when": "Sun 11:01 AM", "tone": "good", "title": "Finish → recap", "body": "Slid to finish at 14.33 mi. The run page turns into the recap: a hero card with every cheer as a circle along the route, plus a Replays list with real waveforms. Visuals are free; Play, Download, Share and Create are Replay Pack features."}, {"when": "Sun 4:20 PM", "tone": "neutral", "title": "Browsed the recap", "body": "Six waveforms loaded in 4 seconds (Jon, Shaan, 성은, Ayaka, Heather, Sid). No individual cheer was fetched after that, so no Sunday replay or export shows up in the logs we still have."}, {"when": "Sun 5:56 PM → Mon 10:16 AM", "tone": "warn", "title": "Gap in the logs", "body": "Supabase's free plan keeps only 24 hours of request logs, and we pulled them at Sun 5:56 PM and Tue 10:16 AM. Anything in between (Sunday evening, Monday morning), including any earlier unlock or Download, is gone."}, {"when": "Mon 12:34 PM", "tone": "good", "title": "Paywall → unlock → listen-through", "body": "Fresh launch, then audio 6 seconds later, so she went through the Replay Pack paywall almost without hesitating. She went through 10 cheers in rail order with gaps that match each cheer's length. This is the “relive it” moment the Replay Pack sells, and she used it unprompted the day after."}, {"when": "Mon 12:41–12:54 PM", "tone": "warn", "title": "Export Athena's cheer for TikTok", "body": "4 more pulls of the same 25s cheer, 1–5 minutes apart. She left and came back at 12:47, then the app was relaunched from scratch at 12:53 (so a second paywall unlock). That's consistent with tapping Download or Share, leaving for Files or TikTok, finding it didn't work as hoped, and coming back. TikTok accepts videos from the camera roll; an .m4a in Files or from the share sheet isn't something TikTok can open directly. The closest in-app path is Create → Save video, which makes a transparent sticker video, not a TikTok-ready 9:16 clip."}, {"when": "Mon 9:39 PM", "tone": "neutral", "title": "Back again, locked", "body": "Opened the run page twice and played nothing. The tester pass had reset, so the cheers were behind the paywall again."}], "blind": ["Which button she used for each Athena pull (Download vs Share vs Create, and Save video / Copy / More inside Create). All four look the same on the server.", "How many times she saw the Replay Pack paywall or tapped “Get the Replay Pack”. Her build unlocks locally for free (ReliveStore.testerBypass = true) and the paywall shows a $29.99/year fallback because the App Store product doesn't load.", "Whether she posted to Instagram or anywhere besides TikTok. Story and Reel handoffs go straight from the phone to Instagram.", "The TikTok itself. Ask her for the link and how she got the audio in."]}, "confusion": [{"title": "Didn't know to stop the run (or forgot)", "severity": "high", "confidence": "Likely", "evidence": "Progress writes every ~16s until ~10:00 AM, then sparse (1–8 min gaps) until Slide to finish at 11:01 AM. 14.33 mi recorded vs 13.1 mi goal.", "why": "About an hour of standing around got recorded as part of the race. Her elapsed time and distance on share cards and Strava are inflated.", "fix": "When distance ≥ goal, show a big “You did it — finish run?” takeover, plus a local notification if the app is in the background. Offer to trim the run back to the moment the goal distance was reached."}, {"title": "A cheer that arrived after the race had nowhere to go", "severity": "high", "confidence": "Confirmed", "evidence": "엄마's cheer at 3:59:38 PM. The push text said “unlock … at mile 12.4”. She opened the app at 3:59:47, then went back and forth between Home and the run page. Even after Monday's 10-cheer listen-through, that cheer's audio has never been downloaded.", "why": "The most emotional cheer (her mom, from Korea) is the one she missed. The push promised something that couldn't happen.", "fix": "notify-cheer: if the run is finished, send “Mom sent you a cheer after your race — tap to listen”, deep-link to the cheer, and autoplay it. On the web cheer page, tell late cheerers “Jennie already finished — she'll hear this in her recap.”"}, {"title": "Getting a cheer onto TikTok took ~4 tries", "severity": "high", "confidence": "Likely", "evidence": "Mon 12:41–12:54 PM: Athena's 25s cheer re-downloaded 4 times, 1–5 min apart, with nothing else in between. She returned to the app at 12:47 and it relaunched from scratch at 12:53. Each Download/Share/Create tap fetches the file fresh. The app has no TikTok destination: Download → .m4a in Files, Share → .m4a in the share sheet, Create → Instagram Reel/Story, Save image/audio/video (transparent sticker video), Copy, More.", "why": "This is the viral moment: a runner wants to post a friend's voice on social. She did it anyway, but by working around the app, and the post likely carries no CheerClub branding or link back.", "fix": "Add a “TikTok” destination in Create: render an opaque 9:16 video (waveform, name, mile, CheerClub mark, audio), save it to Photos and open TikTok via its share SDK. Rename Download to “Save audio file” and add “Save as video” beside it, since that's what social apps accept."}, {"title": "Replay Pack re-locks on every visit (tester bypass)", "severity": "medium", "confidence": "Confirmed", "evidence": "ReliveStore.testerBypass = true in build 202608271228: “Get the Replay Pack” grants a free in-memory pass that's revoked when the run screen disappears. Mon 12:53 PM the app relaunched mid-TikTok and she had to unlock again to re-fetch Athena's cheer. Mon 9:39 PM she opened the run page twice and played nothing. The paywall price falls back to “$29.99 / year” because the product doesn't load (the code comment says $25/year).", "why": "Testers see the paywall over and over for something they already “bought”. That's noisy feedback, and it tells us nothing about willingness to pay. The two prices will confuse anyone comparing.", "fix": "For TestFlight, persist the tester pass for the install (or until the run is deleted). Before launch, sign the Paid Apps agreement, flip testerBypass to false, and pick one price. Log paywall_shown / unlock_tapped so conversion is measurable."}, {"title": "Push mile numbers don't match where cheers actually play", "severity": "medium", "confidence": "Confirmed", "evidence": "Every push quoted a mile between 6.5 and 12.4 (it's computed as cheer index ÷ total at send time). Jon's push said mile 11.9 but his cheer played first, ~5 min in. Later cheers all said “12.x”.", "why": "The numbers shuffle as more cheers arrive and ignore her custom arrangement, which makes the promise feel random.", "fix": "Drop the mile from the push (“It'll play during your run”), or compute it from the runner's current arrangement."}, {"title": "Looking for something on the run page the night before", "severity": "medium", "confidence": "Possible", "evidence": "At 1:30 AM: Home ↔ run page five times in 8 minutes, then Notifications. No audio downloaded.", "why": "She may have been trying to listen to her cheers early, or checking that they would really play. A runner who is anxious the night before needs reassurance, not a locked page.", "fix": "On the run page before the race, show a clear “18 cheers locked and ready — they'll play as you run” state, with a short sample sound or each person's waveform."}, {"title": "Started 8 minutes after the scheduled time, after ~12 minutes on the run page", "severity": "low", "confidence": "Possible", "evidence": "App opened at 7:25:37. The run page refreshed constantly from 7:25 to 7:38. Run started 7:38:13 (scheduled 7:30).", "why": "Normal race-start chaos, or time spent arranging cheers and finding the start control. Can't tell without client analytics.", "fix": "Add client-side analytics for screen views and taps so moments like this are visible."}, {"title": "Cheerer side: Silvia sent 3 cheers in 2 minutes", "severity": "low", "confidence": "Possible", "evidence": "35s, 43s and 6s cheers at 8:10, 8:11 and 8:12 AM Friday.", "why": "Could be deliberate (a 3-part message), or she didn't realize the first one went through, or wanted to re-record. The 6-second one reads like a correction.", "fix": "After sending, show a clear “Sent! Jennie will hear it at mile ~X” confirmation with an option to re-record or add another."}], "wins": ["The cheerer → runner loop works: she arrived as a web cheerer and became an active runner four days later.", "Onboarding is fast: 46 seconds from code to a scheduled half marathon.", "Pushes bring her back: race-morning pushes led to app opens 9–40 seconds later.", "Playback was flawless: 18/18 pre-race and mid-race cheers played, prefetched in under a second, with ~10 connection drops absorbed silently.", "She used the Arrange feature: cheers played in a custom order she chose.", "Post-run: she came back the next day and listened to 10 cheers in a row. Reliving the race is a real, unprompted use case, and exactly what the Replay Pack sells.", "She turned a friend's cheer (Athena's) into a TikTok on her own, which is organic social distribution of a CheerClub cheer the day after the race."], "recs": ["Move the external TestFlight group off build 202608271228 (Aug 27). Jennie and Haofei are both on it, and it predates run-data upload, so we have no route or pace for this race.", "Prompt to finish when goal distance is reached (in-app takeover + background local notification), and let runners trim the overrun.", "Fix notify-cheer copy for finished runs and drop or correct the mile number.", "Add a pre-race “locked & ready” reassurance state on the run page.", "Add a TikTok-ready export: an opaque 9:16 cheer video with CheerClub branding, saved to Photos and handed to TikTok, next to the Instagram options in Create.", "Keep the tester Replay Pack pass for the whole install, and before launch flip testerBypass off and settle the price ($25 vs the $29.99 fallback).", "Add lightweight client analytics (screen views, taps, run start/finish, cheer arrange, paywall shown/unlocked, Play/Download/Share/Create and the destination chosen) so the next brief doesn't need to infer from server logs.", "Pull Supabase logs daily (or upgrade from the free plan's 24h retention). We lost Sun 5:56 PM → Mon 10:16 AM, which may have held earlier replays or downloads.", "Reach out to Jennie: ask for the TikTok link, how she got the audio into TikTok, what she thought of the paywall, plus the night before, the finish, and whether she knows her mom sent another cheer."]}, "u:e9f9eb03-8171-47b3-9d2f-c7b5eaa91ab1": {"headline": "Haofei signed up fast, then stalled: one abandoned 5K, no shares, no cheers.", "tldr": ["Was a web cheerer first (left a phone number Aug 3), then signed up Mon Nov 10 at 2:01 PM.", "Created “Haofei's 5K” (for Tue 8 AM) and “Haofei's 10 mile run” within 4 minutes.", "Started the 5K at some point. It's still in status “running” at 0.01 mi, so he never moved with it and never finished it.", "Neither run has received a cheer, so he most likely never shared a link.", "The 10-mile run is scheduled for Sun Nov 15 at 10:00 PM Pacific. Possibly an AM/PM slip.", "Same old TestFlight build as Jennie (202608271228)."], "confusion": [{"title": "Started a run and left it hanging", "severity": "high", "confidence": "Confirmed", "evidence": "runs.status = running, miles_completed = 0.01, for 4+ days.", "why": "He was probably exploring and tapped start, with no clear way out. A stuck “running” run can also confuse the Home screen.", "fix": "Auto-pause or close runs with no movement after N minutes, and ask whether this was a test."}, {"title": "Never shared, so he never got the magic moment", "severity": "high", "confidence": "Likely", "evidence": "0 cheers on both runs. No push token registered (the prompt only shows after sharing).", "why": "Without cheers, the app is an empty run tracker.", "fix": "Make sharing the next step right after creating a run, and nudge again if there are 0 cheers 24h before start."}]}, "u:ccb6fa54-98e5-4803-92d9-754efa7c5461": {"headline": "Ayush signed up in August, created a 5K for the next morning, and never came back.", "tldr": ["Signed up Thu Aug 13, 9:10 PM and created “Ayush's 5K” a minute later for 7:00 AM the next day.", "No cheers, no push permission, and no activity after Aug 15."]}}};</script>
<script>
const D = window.DATA;
const TZ = "America/Los_Angeles";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const CATS = {
  auth:       { label: "Sign-in",        color: "#469CF8", icon: "🔑" },
  onboarding: { label: "Onboarding",     color: "#FBE74D", icon: "✨" },
  run:        { label: "Run",            color: "#3A8A27", icon: "🏃" },
  cheer:      { label: "Cheers",         color: "#EC605A", icon: "📣" },
  playback:   { label: "Cheer playback", color: "#FBE74D", icon: "🎧" },
  notify:     { label: "Push & inbox",   color: "#0000F5", icon: "🔔" },
  nav:        { label: "Screens",        color: "#b9b9d6", icon: "📱" },
  session:    { label: "App sessions",   color: "#7d7da0", icon: "⏱" },
  share:      { label: "Sharing",        color: "#469CF8", icon: "🔗" },
  postrun:    { label: "Post-run & Replay Pack", color: "#EC605A", icon: "🎬" },
  web:        { label: "Web cheer page", color: "#EC605A", icon: "🌐" },
  telemetry:  { label: "Background",     color: "#3a3a55", icon: "·" },
};
const KINDS = { app: "In the app", web: "On the web", system: "Server / system" };
const TYPE_LABEL = { runner: "App user", cheerer: "Web cheerer", visitor: "Anonymous visitor" };

const fmt = (t, o) => new Intl.DateTimeFormat("en-US", { timeZone: TZ, ...o }).format(new Date(t));
const fTime = t => fmt(t, { hour: "numeric", minute: "2-digit", second: "2-digit" });
const fTimeS = t => fmt(t, { hour: "numeric", minute: "2-digit" });
const fDay = t => fmt(t, { weekday: "long", month: "short", day: "numeric" });
const fDayS = t => fmt(t, { weekday: "short", month: "short", day: "numeric" });
const fFull = t => fmt(t, { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
const dayFmt = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" });
const dayKey = t => dayFmt.format(new Date(t));
const hourOf = t => +fmt(t, { hour: "numeric", hour12: false }) % 24;
const dur = ms => { const m = Math.round(ms / 60000); if (m < 1) return `${Math.round(ms / 1000)}s`; if (m < 60) return `${m}m`; const h = Math.floor(m / 60); if (h < 48) return `${h}h ${m % 60}m`; return `${Math.round(h / 24)}d`; };

const people = D.people;
const pname = k => people[k]?.name ?? "?";
const avatarColor = name => ["#FBE74D", "#469CF8", "#EC605A", "#3A8A27", "#ffffff"][[...(name || "?")].reduce((a, c) => a + c.codePointAt(0), 0) % 5];
const isReal = k => people[k] && !people[k].test;

const state = { person: null, view: "brief", journey: { cats: new Set(Object.keys(CATS).filter(c => c !== "telemetry")), q: "", src: "all" }, hlEvent: null };

/* ---------- header ---------- */
function initHeader() {
  const sel = $("#person");
  const order = Object.values(people).filter(p => !p.test && p.firstSeen)
    .sort((a, b) => (b.type === "runner") - (a.type === "runner") || (D.briefs[b.key] ? 1 : 0) - (D.briefs[a.key] ? 1 : 0) || b.lastSeen - a.lastSeen);
  const groups = { runner: [], cheerer: [], visitor: [] };
  order.forEach(p => groups[p.type].push(p));
  sel.innerHTML = `<option value="_all">Everyone (overview)</option>` + Object.entries(groups).map(([t, list]) =>
    `<optgroup label="${TYPE_LABEL[t]}s">${list.map(p => `<option value="${p.key}">${esc(p.name)}${D.briefs[p.key] ? " ★" : ""}</option>`).join("")}</optgroup>`).join("");
  const jennie = order.find(p => p.name === "Jennie" && p.type === "runner");
  state.person = jennie ? jennie.key : "_all";
  sel.value = state.person;
  sel.onchange = () => { state.person = sel.value; render(); };
  document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => go(b.dataset.v));
  const w = D.logWindows;
  $("#fresh").innerHTML = `Data fetched ${D.fetchedAt ? fFull(D.fetchedAt) : "?"} PT · database history is complete; request logs (screens, taps, race telemetry) cover ${w.length ? `${fFull(Math.min(...w.map(x => x.start)))} → ${fFull(Math.max(...w.map(x => x.end)))}` : "no window"} · all times Pacific`;
}
function go(v) {
  state.view = v;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  document.querySelectorAll(".view").forEach(el => el.classList.toggle("on", el.id === "v-" + v));
  render();
  window.scrollTo({ top: 0 });
}

/* ---------- helpers ---------- */
const evsOf = k => D.events.filter(e => e.p === k);
function statTiles(stats) {
  return `<div class="grid g6" style="margin-top:16px">${stats.map(s => `<div class="card stat"><div class="v">${esc(s.value)}</div><div class="l">${esc(s.label)}</div>${s.sub ? `<div class="s">${esc(s.sub)}</div>` : ""}</div>`).join("")}</div>`;
}
function computedStats(k) {
  const p = people[k], ev = evsOf(k), c = n => ev.filter(e => e.name === n).length;
  const out = [];
  if (p.type === "runner") {
    out.push({ label: "Runs created", value: c("run_created") });
    out.push({ label: "Cheers received", value: c("cheer_received"), sub: `${ev.filter(e => e.name === "cheer_received" && e.played).length} played` });
    out.push({ label: "Cheers sent", value: c("cheer_sent") });
    out.push({ label: "App-active moments", value: c("app_active") + c("app_open"), sub: "session refreshes + logged opens" });
  } else {
    out.push({ label: "Cheers sent", value: c("cheer_sent") });
    out.push({ label: "Link opens (logged)", value: c("link_opened") });
    out.push({ label: "Phone saved", value: c("phone_saved") + c("sms_opt_in") ? "yes" : "no" });
  }
  out.push({ label: "First seen", value: p.firstSeen ? fDayS(p.firstSeen) : "—", sub: p.firstSeen ? fTimeS(p.firstSeen) : "" });
  out.push({ label: "Last seen", value: p.lastSeen ? fDayS(p.lastSeen) : "—", sub: p.lastSeen ? fTimeS(p.lastSeen) : "" });
  return out;
}
function autoSummary(k) {
  const p = people[k], ev = evsOf(k).filter(e => !e.noise), lines = [];
  const first = (n) => ev.find(e => e.name === n);
  if (p.type === "runner") {
    const s = first("profile_created"); if (s) lines.push(`Created a profile on ${fFull(s.t)}.`);
    const runs = ev.filter(e => e.name === "run_created"); if (runs.length) lines.push(`Created ${runs.length} run${runs.length > 1 ? "s" : ""}: ${runs.slice(0, 4).map(r => `“${D.runs[r.run]?.title}” (${D.runs[r.run]?.status})`).join(", ")}${runs.length > 4 ? "…" : ""}.`);
    const rec = ev.filter(e => e.name === "cheer_received"); if (rec.length) lines.push(`Received ${rec.length} cheers from ${new Set(rec.map(e => e.sender)).size} people; ${rec.filter(e => e.played).length} were played.`);
    const sent = ev.filter(e => e.name === "cheer_sent"); if (sent.length) lines.push(`Sent ${sent.length} cheer${sent.length > 1 ? "s" : ""} to other runners.`);
    if (!first("push_enabled")) lines.push("Never registered for push notifications.");
  } else {
    ev.filter(e => e.name === "cheer_sent").forEach(e => lines.push(`${fFull(e.t)} — ${e.label.replace("Sent", "sent")}.`));
    if (ev.some(e => e.name === "sms_opt_in" || e.name === "phone_saved")) lines.push("Left a phone number for run updates.");
    if (p.type === "visitor") lines.push(`Opened a cheer link ${ev.filter(e => e.name === "link_opened").length}× from ${p.cities.join(", ")} (${p.devices.join(", ")}) but never submitted a cheer in the logged window.`);
  }
  return lines;
}

/* ---------- brief ---------- */
function renderBrief() {
  const el = $("#v-brief"), k = state.person;
  if (k === "_all") return renderOverviewBrief(el);
  const p = people[k], b = D.briefs[k] || {};
  const chips = [
    `<span class="chip">${TYPE_LABEL[p.type]}</span>`,
    p.build ? `<span class="chip">Build <b>${esc(p.build.replace("CheerClub/", ""))}</b></span>` : "",
    p.firstSeen ? `<span class="chip">First seen <b>${fFull(p.firstSeen)}</b></span>` : "",
    p.lastSeen ? `<span class="chip">Last seen <b>${fFull(p.lastSeen)}</b></span>` : "",
    p.activeDays ? `<span class="chip">Active on <b>${p.activeDays}</b> days</span>` : "",
    p.alsoCheerer ? `<span class="chip">Also cheered as a web cheerer</span>` : "",
  ].join("");
  let html = `<div class="card hero"><h1 class="who">${esc(p.name)}</h1>
    <div class="headline">${esc(b.headline || autoSummary(k)[0] || "No activity recorded yet.")}</div><div class="chips">${chips}</div></div>`;
  html += statTiles(b.stats || computedStats(k));
  const tldr = b.tldr || autoSummary(k);
  if (tldr.length) html += `<section><h2>TL;DR</h2><ul class="tldr">${tldr.map(t => `<li>${esc(t)}</li>`).join("")}</ul></section>`;
  html += `<section><h2>When ${esc(p.name)} was active <span class="count">events per hour, Pacific · click a cell to jump there</span></h2><div class="card">${heatmap(evsOf(k).filter(e => !e.noise && e.kind !== "system"))}</div></section>`;
  if (b.chapters) {

/* ---------- heatmap (day x hour) ---------- */
function heatmap(evs) {
  if (!evs.length) return `<div class="empty">No activity.</div>`;
  const days = [...new Set(evs.map(e => dayKey(e.t)))].sort();
  const grid = {};
  evs.forEach(e => { const k = dayKey(e.t) + "|" + hourOf(e.t); grid[k] = (grid[k] || 0) + 1; });
  const max = Math.max(...Object.values(grid));
  const sample = Object.fromEntries(evs.map(e => [dayKey(e.t), e.t]));
  let html = `<div class="heat"><div></div>`;
  for (let h = 0; h < 24; h++) html += `<div class="lbl" style="justify-content:center">${h % 3 === 0 ? (h === 0 ? "12a" : h < 12 ? h + "a" : h === 12 ? "12p" : (h - 12) + "p") : ""}</div>`;
  days.forEach(d => {
    html += `<div class="lbl">${fDayS(sample[d])}</div>`;
    for (let h = 0; h < 24; h++) {
      const n = grid[d + "|" + h] || 0, a = n ? 0.18 + 0.82 * Math.sqrt(n / max) : 0;
      html += `<div class="cell" data-d="${d}" data-h="${h}" data-n="${n}" style="${n ? `background:rgba(251,231,77,${a.toFixed(2)})` : ""}"></div>`;
    }
  });
  return html + `</div>`;
}
function bindHeat(el, k) {
  el.querySelectorAll(".heat .cell").forEach(c => {
    const n = +c.dataset.n;
    c.onmousemove = ev => n && showTip(ev, `<b>${n}</b> event${n > 1 ? "s" : ""} · ${c.dataset.h}:00–${+c.dataset.h + 1}:00`);
    c.onmouseleave = hideTip;
    if (n) { c.style.cursor = "pointer"; c.onclick = () => {
      const pool = k ? evsOf(k) : D.events.filter(e => isReal(e.p));
      const e = pool.find(e => !e.noise && dayKey(e.t) === c.dataset.d && hourOf(e.t) === +c.dataset.h);
      if (e) jumpTo(k || e.p, e.t);
    }; }
  });
}

function renderRace() {

  const start = a?.start || run.scheduled;
  html += `<section><h2>Every cheer <span class="count">${run.notes.length} cheers from ${new Set(run.notes.map(n => n.cheerer || n.sender)).size} people · click a name for their journey</span></h2><div class="card" style="padding:0;overflow:auto"><table><thead><tr>

/* Steady running reports distance every ~15s (≈8 per 2 min). The first
   10-minute stretch averaging under half that rate marks where the runner
   stopped moving steadily — later walking bursts don't count. */
function movementStop(a) {
  const B = 120e3, end = a.finish || a.syncs[a.syncs.length - 1];
  if (!end) return null;
  const n = Math.ceil((end - a.start) / B), counts = new Array(n).fill(0);
  a.syncs.forEach(t => { const b = Math.floor((t - a.start) / B); if (b < n) counts[b]++; });
  const sorted = counts.slice().sort((x, y) => x - y), median = sorted[Math.floor(n / 2)] || 0;
  for (let i = 5; i + 5 <= n; i++) {
    const avg = counts.slice(i, i + 5).reduce((s, c) => s + c, 0) / 5;
    if (avg < median / 2) return a.start + i * B;
  }
  return null;
}
function drawRaceChart(host, run, a) {
  host.style.overflowX = "auto";
  const W = Math.max(host.clientWidth - 20, 680), H = 390, L = 30, R = 30, T = 150, Bm = 40;
  const t0 = Math.min(a.start - 15 * 60e3, ...run.notes.filter(n => n.t > a.start - 3600e3).map(n => n.t));
  const t1 = Math.max(a.finish || a.start, ...a.syncs) + 10 * 60e3;
  const x = t => L + (t - t0) / (t1 - t0) * (W - L - R);
  const B = 120e3, buckets = {};
  a.syncs.forEach(t => { const b = Math.floor((t - a.start) / B); buckets[b] = (buckets[b] || 0) + 1; });
  const maxB = Math.max(8, ...Object.values(buckets));
  const y = n => H - Bm - n / maxB * (H - Bm - T);
  let s = `<svg width="${W}" height="${H}" style="display:block">`;
  const stop = movementStop(a);
  if (stop && a.finish && a.finish - stop > 10 * 60e3) {
    s += `<rect x="${x(stop)}" y="${T - 10}" width="${x(a.finish) - x(stop)}" height="${H - Bm - T + 10}" fill="rgba(236,96,90,.10)" stroke="rgba(236,96,90,.4)" stroke-dasharray="4 4"/>
      <text x="${(x(stop) + x(a.finish)) / 2}" y="${T + 8}" fill="#EC605A" font-size="12" font-weight="700" text-anchor="middle">mostly standing still · tracker on ${dur(a.finish - stop)} more</text>`;
  }
  for (let t = Math.ceil(t0 / 1800e3) * 1800e3; t < t1; t += 1800e3) {
    s += `<line x1="${x(t)}" x2="${x(t)}" y1="${T - 10}" y2="${H - Bm}" stroke="#1d1d30"/><text x="${x(t)}" y="${H - Bm + 18}" fill="#8d8daa" font-size="11.5" text-anchor="middle">${fTimeS(t)}</text>`;
  }
  Object.entries(buckets).forEach(([b, n]) => {
    const bt = a.start + +b * B;
    s += `<rect class="hb" data-tip="${fTimeS(bt)}–${fTimeS(bt + B)} · ${n} distance reports" x="${x(bt) + 0.5}" y="${y(n)}" width="${Math.max(1, x(bt + B) - x(bt) - 1)}" height="${H - Bm - y(n)}" rx="2" fill="#3A8A27" opacity="${0.45 + 0.55 * n / maxB}"/>`;
  });
  const mk = (t, label, color, anchor) => `<line x1="${x(t)}" x2="${x(t)}" y1="10" y2="${H - Bm}" stroke="${color}" stroke-width="2"/><text x="${x(t) + (anchor === "end" ? -6 : 6)}" y="20" fill="${color}" font-size="12" font-weight="700" text-anchor="${anchor || "start"}">${label}</text>`;
  if (run.scheduled && run.scheduled > t0) s += `<line x1="${x(run.scheduled)}" x2="${x(run.scheduled)}" y1="${T - 10}" y2="${H - Bm}" stroke="#8d8daa" stroke-dasharray="3 4"/><text x="${x(run.scheduled) - 4}" y="${H - Bm - 6}" fill="#8d8daa" font-size="11" text-anchor="end">scheduled</text>`;
  s += mk(a.start, "START " + fTimeS(a.start), "#fff");
  if (a.finish) s += mk(a.finish, "SLID TO FINISH " + fTimeS(a.finish), "#fff", "end");
  a.reconnects.forEach(t => s += `<rect class="hb" data-tip="Live cheer feed reconnected · ${fTime(t)}" x="${x(t) - 1.5}" y="${H - Bm + 2}" width="3" height="8" fill="#469CF8"/>`);
  const notes = new Map(run.notes.map(n => [n.id, n]));
  a.plays.forEach((p, i) => {
    const n = notes.get(p.note) || {}, lane = i % 4, cy = 44 + lane * 22;
    s += `<line x1="${x(p.t)}" x2="${x(p.t)}" y1="${cy}" y2="${H - Bm}" stroke="rgba(251,231,77,.25)"/>
      <circle class="hb" data-tip="<b>${esc(n.sender)}</b> played at ${fTime(p.t)}<br>${dur(p.t - a.start)} into the run · ${n.dur ?? "?"}s cheer<br>recorded ${fFull(n.t)}" cx="${x(p.t)}" cy="${cy}" r="7" fill="#FBE74D"/>
      <text x="${x(p.t) + 10}" y="${cy + 4}" fill="#FBE74D" font-size="11.5">${esc((n.sender || "").slice(0, 14))}</text>`;
  });
  run.notes.filter(n => n.t > a.start && n.t < t1).forEach(n => {
    s += `<path class="hb" data-tip="<b>${esc(n.sender)}</b> sent a cheer at ${fTime(n.t)}${n.played ? "" : "<br><b>never played</b>"}" d="M${x(n.t)} ${H - Bm - 8} l7 7 l-7 7 l-7 -7z" fill="#EC605A"/>`;
  });
  s += `</svg>`;
  host.innerHTML = s;
  host.querySelectorAll(".hb").forEach(n => { n.onmousemove = ev => showTip(ev, n.dataset.tip); n.onmouseleave = hideTip; });
}

/* ---------- explore ---------- */
const X = { people: null, cats: new Set(Object.keys(CATS).filter(c => c !== "telemetry")), kinds: new Set(Object.keys(KINDS)), names: null, src: "all", from: "", to: "", group: "name", split: "cat", hideTest: true, page: 0 };
function exploreFiltered() {
  return D.events.filter(e => (!X.hideTest || isReal(e.p)) && (!X.people || X.people.has(e.p)) && X.cats.has(e.cat) && X.kinds.has(e.kind) &&
    (!X.names || X.names.has(e.name)) && (X.src === "all" || e.src === X.src) &&
    (!X.from || dayKey(e.t) >= X.from) && (!X.to || dayKey(e.t) <= X.to));
}
const GROUPS = {
  name: { label: "Event", key: e => e.name, show: k => k.replace(/_/g, " ") },
  cat: { label: "Category", key: e => e.cat, show: k => CATS[k]?.label || k },
  person: { label: "Person", key: e => e.p, show: k => pname(k) },
  day: { label: "Day", key: e => dayKey(e.t), show: k => k, sort: "key" },
  hour: { label: "Hour of day", key: e => String(hourOf(e.t)).padStart(2, "0"), show: k => `${+k}:00`, sort: "key" },
  kind: { label: "Where", key: e => e.kind, show: k => KINDS[k] || k },
  src: { label: "Source", key: e => e.src, show: k => k === "db" ? "Database" : "Request logs" },
  run: { label: "Run", key: e => e.run || "(none)", show: k => D.runs[k]?.title || k },
};
const SPLIT_COLORS = ["#FBE74D", "#469CF8", "#EC605A", "#3A8A27", "#ffffff", "#0000F5", "#9a9ab0"];
function renderExplore() {
  const el = $("#v-explore");
  if (X.people === null && state.person !== "_all") X.people = new Set([state.person]);
  const base = D.events.filter(e => !X.hideTest || isReal(e.p));
  const pc = {}; base.forEach(e => pc[e.p] = (pc[e.p] || 0) + 1);
  const nc = {}; base.forEach(e => nc[e.name] = (nc[e.name] || 0) + 1);
  const plist = Object.keys(pc).sort((a, b) => pc[b] - pc[a]);
  const evs = exploreFiltered();
  const G = GROUPS[X.group], S = X.split !== "none" ? GROUPS[X.split] : null;
  const agg = new Map();
  evs.forEach(e => { const g = G.key(e), s = S ? S.key(e) : "_"; if (!agg.has(g)) agg.set(g, new Map()); const m = agg.get(g); m.set(s, (m.get(s) || 0) + 1); });
  let rows = [...agg.entries()].map(([g, m]) => ({ g, m, n: [...m.values()].reduce((a, b) => a + b, 0) }));
  rows.sort(G.sort === "key" ? (a, b) => a.g < b.g ? -1 : 1 : (a, b) => b.n - a.n);
  const splitKeys = S ? [...new Set(evs.map(S.key))].sort((a, b) => evs.filter(e => S.key(e) === b).length - evs.filter(e => S.key(e) === a).length) : ["_"];
  const scol = k => X.split === "cat" ? (CATS[k]?.color || "#555") : SPLIT_COLORS[splitKeys.indexOf(k) % SPLIT_COLORS.length];
  const max = Math.max(1, ...rows.map(r => r.n));
  const cb = (id, list, sel, label, count) => `<div class="cbl" id="${id}">${list.map(v => `<label><input type="checkbox" value="${esc(v)}" ${sel(v) ? "checked" : ""}>${label(v)}<span class="n">${count(v) ?? ""}</span></label>`).join("")}</div>`;
  el.innerHTML = `<div class="explore"><div class="card side">
    <h4>People</h4><div class="row" style="margin-bottom:6px"><button class="btn ghost" id="pall" style="padding:4px 10px;font-size:12px">All</button><button class="btn ghost" id="pnone" style="padding:4px 10px;font-size:12px">None</button>
    <label class="small muted" style="margin-left:auto"><input type="checkbox" id="hidetest" ${X.hideTest ? "checked" : ""}> hide test accts</label></div>
    ${cb("fp", plist, v => !X.people || X.people.has(v), v => `<span class="avatar" style="width:16px;height:16px;border-radius:50%;background:${avatarColor(pname(v))};display:inline-block"></span>${esc(pname(v))}`, v => pc[v])}
    <h4>Category</h4>${cb("fc", Object.keys(CATS), v => X.cats.has(v), v => `<span style="color:${CATS[v].color}">●</span> ${CATS[v].label}`, () => null)}
    <h4>Where</h4>${cb("fk", Object.keys(KINDS), v => X.kinds.has(v), v => KINDS[v], () => null)}
    <h4>Event type</h4>${cb("fn", Object.keys(nc).sort(), v => !X.names || X.names.has(v), v => v.replace(/_/g, " "), v => nc[v])}
    <h4>Source</h4><select class="pill" id="fsrc" style="width:100%"><option value="all">All</option><option value="db">Database</option><option value="logs">Request logs</option></select>
    <h4>Date range (Pacific)</h4><div class="row"><input type="date" class="pill" id="ffrom" value="${X.from}" style="width:100%"><input type="date" class="pill" id="fto" value="${X.to}" style="width:100%"></div>
    </div><div>
    <div class="card"><div class="row"><span class="muted">Group by</span><select class="pill" id="xg">${Object.entries(GROUPS).map(([k, v]) => `<option value="${k}">${v.label}</option>`).join("")}</select>
      <span class="muted">split by</span><select class="pill" id="xs"><option value="none">Nothing</option>${Object.entries(GROUPS).map(([k, v]) => `<option value="${k}">${v.label}</option>`).join("")}</select>
      <div class="spacer"></div><span class="display" style="color:var(--yellow);font-size:22px">${evs.length.toLocaleString()}</span><span class="muted">events</span>
      <button class="btn" id="csv">Export CSV</button></div>
      <div class="bars" style="margin-top:18px">${rows.slice(0, 60).map(r => `<div class="bar" data-g="${esc(r.g)}"><div class="t" title="${esc(G.show(r.g))}">${esc(G.show(r.g))}</div>
        <div class="track">${splitKeys.filter(k => r.m.get(k)).map(k => `<span data-tip="${esc(S ? S.show(k) : "")} · ${r.m.get(k)}" style="width:${r.m.get(k) / max * 100}%;background:${S ? scol(k) : "var(--yellow)"}"></span>`).join("")}</div><div class="c">${r.n.toLocaleString()}</div></div>`).join("") || `<div class="empty">Nothing matches these filters.</div>`}</div>
      ${S ? `<div class="legend">${splitKeys.slice(0, 14).map(k => `<span><i style="background:${scol(k)}"></i>${esc(S.show(k))}</span>`).join("")}</div>` : ""}
      ${rows.length > 60 ? `<div class="muted small" style="margin-top:8px">+${rows.length - 60} more groups</div>` : ""}</div>
    <section><h2>Over time <span class="count">${X.split === "cat" ? "stacked by category" : ""}</span></h2><div class="card" id="xtime"></div></section>
    <section><h2>Day × hour</h2><div class="card">${heatmap(evs.filter(e => e.kind !== "system"))}</div></section>
    <section><h2>Matching events <span class="count">click a row for details</span></h2><div class="card" style="padding:0;max-height:620px;overflow:auto"><table><thead><tr><th>When (PT)</th><th>Who</th><th>Event</th><th>Category</th><th></th></tr></thead><tbody>
      ${evs.slice().reverse().slice(0, 400).map(e => `<tr data-id="${e.id}" style="cursor:pointer"><td class="muted" style="white-space:nowrap">${fFull(e.t)}</td><td>${esc(pname(e.p))}</td><td>${esc(e.label)}</td><td><span style="color:${CATS[e.cat]?.color}">●</span> ${CATS[e.cat]?.label}</td><td>${e.conf === "inferred" ? `<span class="badge b-inf">inferred</span>` : ""}</td></tr>`).join("")}
    </tbody></table>${evs.length > 400 ? `<div class="muted small" style="padding:10px">Showing newest 400 of ${evs.length}. Export CSV for everything.</div>` : ""}</div></section>
    </div></div>`;
  $("#xg").value = X.group; $("#xs").value = X.split; $("#fsrc").value = X.src;
  const readSet = id => new Set([...el.querySelectorAll(`#${id} input:checked`)].map(i => i.value));
  $("#fp").onchange = () => { X.people = readSet("fp"); renderExplore(); };
  $("#fc").onchange = () => { X.cats = readSet("fc"); renderExplore(); };
  $("#fk").onchange = () => { X.kinds = readSet("fk"); renderExplore(); };
  $("#fn").onchange = () => { const s = readSet("fn"); X.names = s.size === Object.keys(nc).length ? null : s; renderExplore(); };
  $("#pall").onclick = () => { X.people = null; renderExplore(); };
  $("#pnone").onclick = () => { X.people = new Set(); renderExplore(); };
  $("#hidetest").onchange = e => { X.hideTest = e.target.checked; renderExplore(); };
  $("#fsrc").onchange = e => { X.src = e.target.value; renderExplore(); };
  $("#ffrom").onchange = e => { X.from = e.target.value; renderExplore(); };
  $("#fto").onchange = e => { X.to = e.target.value; renderExplore(); };
  $("#xg").onchange = e => { X.group = e.target.value; renderExplore(); };
  $("#xs").onchange = e => { X.split = e.target.value; renderExplore(); };
  $("#csv").onclick = () => exportCsv(evs);
  el.querySelectorAll(".bar .track span").forEach(s => { s.onmousemove = ev => s.dataset.tip && showTip(ev, s.dataset.tip); s.onmouseleave = hideTip; });
  el.querySelectorAll("tr[data-id]").forEach(r => r.onclick = () => openDrawer(D.events[+r.dataset.id]));
  el.querySelectorAll(".bar").forEach(b => b.onclick = () => {
    const g = b.dataset.g;
    if (X.group === "person") selectPerson(g, "brief");
    else if (X.group === "name") { X.names = new Set([g]); renderExplore(); }
    else if (X.group === "cat") { X.cats = new Set([g]); renderExplore(); }
  });
  bindHeat(el, null);
  timeChart($("#xtime"), evs, S ? splitKeys : null, S, scol);
}
function timeChart(host, evs, splitKeys, S, scol) {
  if (!evs.length) { host.innerHTML = `<div class="empty">No events.</div>`; return; }
  const span = evs[evs.length - 1].t - evs[0].t, hourly = span < 4 * 86400e3;
  const bucket = t => hourly ? dayKey(t) + " " + String(hourOf(t)).padStart(2, "0") : dayKey(t);
  const keys = [], seen = new Set(), map = {};
  evs.forEach(e => { const b = bucket(e.t); if (!seen.has(b)) { seen.add(b); keys.push([b, e.t]); } const s = S ? S.key(e) : "_"; map[b] = map[b] || {}; map[b][s] = (map[b][s] || 0) + 1; });
  const W = host.clientWidth - 44, H = 200, max = Math.max(...keys.map(([b]) => Object.values(map[b]).reduce((a, c) => a + c, 0)));
  const bw = Math.max(2, Math.min(28, W / keys.length - 2));
  let s = `<svg width="${W}" height="${H + 26}">`;
  keys.forEach(([b, t], i) => {
    let y = H; const xx = i * (W / keys.length);
    (splitKeys || ["_"]).forEach(k => { const n = map[b][k]; if (!n) return; const h = n / max * (H - 10); y -= h;
      s += `<rect class="hb" data-tip="${hourly ? fFull(t) : fDayS(t)}<br>${S ? esc(S.show(k)) + ": " : ""}<b>${n}</b>" x="${xx}" y="${y}" width="${bw}" height="${h}" fill="${S ? scol(k) : "#FBE74D"}" rx="1.5"/>`; });
    if (i % Math.ceil(keys.length / 10) === 0) s += `<text x="${xx}" y="${H + 18}" fill="#8d8daa" font-size="11">${hourly ? fmt(t, { weekday: "short", hour: "numeric" }) : fDayS(t)}</text>`;
  });
  host.innerHTML = s + `</svg>`;
  host.querySelectorAll(".hb").forEach(n => { n.onmousemove = ev => showTip(ev, n.dataset.tip); n.onmouseleave = hideTip; });
}
function exportCsv(evs) {
  const cols = ["time_pt", "person", "person_type", "category", "event", "label", "detail", "where", "source", "confidence", "run", "sender", "transcript"];
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const lines = [cols.join(",")].concat(evs.map(e => [fFull(e.t) + " " + fTime(e.t), pname(e.p), people[e.p]?.type, e.cat, e.name, e.label, e.detail, e.kind, e.src, e.conf, D.runs[e.run]?.title, e.sender, e.transcript].map(q).join(",")));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([lines.join("\n")], { type: "text/csv" }));
  a.download = "cheerclub-events.csv"; a.click();
}

/* ---------- people ---------- */
function renderPeople() {
  const el = $("#v-people");
  const all = Object.values(people).filter(p => !p.test && p.firstSeen).sort((a, b) => b.lastSeen - a.lastSeen);
  const t0 = Math.min(...all.map(p => p.firstSeen)), t1 = Math.max(...all.map(p => p.lastSeen));
  const visitors = all.filter(p => (p.counts.link_opened || 0) > 0);
  const opened = visitors.length, submitted = visitors.filter(p => p.counts.cheer_uploaded).length, phone = visitors.filter(p => p.counts.phone_saved).length;
  const cheerersAll = all.filter(p => p.type === "cheerer" || p.alsoCheerer);
  const optin = cheerersAll.filter(p => p.counts.sms_opt_in).length;
  const card = p => {
    const ev = evsOf(p.key).filter(e => !e.noise);
    const c = p.counts, line = p.type === "runner"
      ? `${c.run_created || 0} runs · ${c.cheer_received || 0} cheers in · ${c.cheer_sent || 0} out`
      : p.type === "cheerer" ? `${c.cheer_sent || 0} cheer${c.cheer_sent === 1 ? "" : "s"} sent${c.sms_opt_in ? " · gave phone" : ""}` : `${c.link_opened || 0} link opens · no cheer`;
    const W = 260, pts = ev.map(e => (e.t - t0) / Math.max(1, t1 - t0) * W);
    return `<div class="card pcard" data-k="${p.key}"><div class="nm"><span class="avatar" style="background:${avatarColor(p.name)}">${esc([...p.name][0])}</span>${esc(p.name)}${D.briefs[p.key] ? ` <span class="badge b-medium">brief</span>` : ""}</div>
      <div class="muted small" style="margin-top:6px">${TYPE_LABEL[p.type]} · ${line}</div><div class="muted small">${fDayS(p.firstSeen)} → ${fDayS(p.lastSeen)}${p.cities?.length ? " · " + esc(p.cities.join(", ")) : ""}</div>
      <svg class="spark" width="100%" viewBox="0 0 ${W} 34" preserveAspectRatio="none"><line x1="0" x2="${W}" y1="17" y2="17" stroke="#23233a"/>${pts.map((x, i) => `<circle cx="${x}" cy="17" r="3" fill="${CATS[ev[i].cat]?.color}" opacity=".85"/>`).join("")}</svg></div>`;
  };
  const sec = (title, list) => list.length ? `<section><h2>${title} <span class="count">${list.length}</span></h2><div class="grid g3">${list.map(card).join("")}</div></section>` : "";
  el.innerHTML = `<section><h2>Web cheer funnel <span class="count">logged window only · unique devices</span></h2><div class="card funnel">
      ${[["Opened a cheer link", opened], ["Recorded & sent a cheer", submitted], ["Left their phone number", phone]].map(([l, n]) => `<div class="fstep"><div>${l}</div><div class="track"><span style="width:${opened ? n / opened * 100 : 0}%"></span></div><div class="display" style="color:var(--yellow)">${n}</div></div>`).join("")}
      <div class="muted small">All-time: ${cheerersAll.length} people have cheered; ${optin} opted into SMS updates. Sparkline dots span ${fDayS(t0)} → ${fDayS(t1)}.</div></div></section>
    ${sec("App users", all.filter(p => p.type === "runner"))}${sec("Web cheerers", all.filter(p => p.type === "cheerer"))}${sec("Visitors who didn't cheer", all.filter(p => p.type === "visitor"))}`;
  el.querySelectorAll(".pcard").forEach(c => c.onclick = () => selectPerson(c.dataset.k, "brief"));
}

function render() {
  hideTip();
  ({ brief: renderBrief, journey: renderJourney, race: renderRace, explore: renderExplore, people: renderPeople })[state.view]();
}
initHeader();
render();
addEventListener("resize", debounce(() => (state.view === "race" || state.view === "explore") && render(), 200));
</script>
</body>
</html>
